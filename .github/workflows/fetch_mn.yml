# Разовая выгрузка каталога Монголбанка в ветку mn-raw (для подготовки данных; запускается вручную)
name: Выгрузка Монголии
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install requests
      - run: python tools/fetch_mn.py
      - run: |
          git config user.name "jadiger-bot"; git config user.email "jadiger-bot@users.noreply.github.com"
          git checkout --orphan mn-raw
          git rm -rq --cached .
          git add mn_raw
          git commit -qm "Монголбанк: сырые данные"
          git push -f origin mn-raw
