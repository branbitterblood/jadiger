# Фото монет: img/ → R2 (img.jadiger.com) через сайт. Запускается после изменений в img/ и вручную.
name: Фото в R2
on:
  push:
    branches: [main]
    paths: ['img/**']
  workflow_dispatch: {}
concurrency: { group: img-sync, cancel-in-progress: false }
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests
      - name: Ждём публикации сайта
        run: sleep 150
      - run: python tools/img_sync.py https://jadiger.com
